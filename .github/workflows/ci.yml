name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/fmt.txt && test ! -s /tmp/fmt.txt
        shell: bash
      - run: go test ./...
      - run: go build -ldflags="-s -w" -o fabi${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: binary size gate (≤10MB, SPEC #59)
        run: |
          size=$(stat -c%s fabi* 2>/dev/null || stat -f%z fabi*)
          echo "binary: $size bytes"
          [ "$size" -lt 10485760 ]
        shell: bash
      - name: cross-compile all 6 release targets
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -ldflags="-s -w" -o /tmp/fabi-x .
          done
          echo "6/6 targets compile"
        if: matrix.os == 'ubuntu-latest'
        shell: bash
      - name: selftest on ${{ matrix.os }}
        run: ./fabi${{ matrix.os == 'windows-latest' && '.exe' || '' }} selftest
        shell: bash
